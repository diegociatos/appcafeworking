# ============================================================================
# CafeWorking — configuração de deploy na Netlify
# ============================================================================

[build]
  command = "npm run build"
  publish = "dist"

  # NOTA (2026-07-22): a regra `ignore` foi REMOVIDA. Ela usava
  #   git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public index.html ...
  # e estava CANCELANDO builds legítimos de front-end ("Canceled build due to no
  # content change") — commits com mudança em src/ ficavam sem publicar. Sem a
  # regra, todo push pra main builda e publica (o build Vite leva ~15-20s).
  # Se quiser reativar a economia de build no futuro, teste que o
  # $CACHED_COMMIT_REF esteja disponível no clone raso da Netlify antes.

[build.environment]
  NODE_VERSION = "22"
  # Instalação mais rápida e silenciosa
  NPM_FLAGS = "--no-audit --no-fund"

# SPA: todas as rotas servem o index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache longo para os assets versionados (hash no nome) — menos banda em
# visitas repetidas. O index.html não é cacheado (sempre pega a versão nova).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
